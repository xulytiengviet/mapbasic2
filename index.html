<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Vietflex Map — PMTiles Layers</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.css"
        crossorigin="anonymous" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/Vietflexmap/VN@6144d565fcf236727577ab3c4471bbe49f86892f/dist/vietflex.css" />

  <link rel="stylesheet" href="./styles.css?v=7" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Bản đồ Vietflex"></div>

    <section id="layerPanel" class="layer-panel" aria-label="Các lớp bản đồ">
      <button id="layerPanelToggle"
              class="layer-panel-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="layerPanelBody">
        <span>Lớp bản đồ</span>
        <span class="layer-chevron" aria-hidden="true">⌃</span>
      </button>

      <div id="layerPanelBody" class="layer-panel-body">

        <div class="layer-row" data-layer-row="mapbasic2" data-state="idle">
          <div class="layer-main">
            <label class="layer-name">
              <input type="checkbox"
                     data-layer-toggle="mapbasic2"
                     checked />
              <span>Mapbasic2</span>
            </label>
            <span class="layer-status">Chưa tải</span>
          </div>

          <div class="opacity-row">
            <span>Độ mờ</span>
            <input type="range"
                   min="0"
                   max="100"
                   value="100"
                   data-layer-opacity="mapbasic2"
                   aria-label="Độ trong suốt Mapbasic2" />
          </div>
        </div>

        <div class="layer-row" data-layer-row="mapbasic" data-state="idle">
          <div class="layer-main">
            <label class="layer-name">
              <input type="checkbox"
                     data-layer-toggle="mapbasic" />
              <span>Mapbasic</span>
            </label>
            <span class="layer-status">Chưa tải</span>
          </div>

          <div class="opacity-row">
            <span>Độ mờ</span>
            <input type="range"
                   min="0"
                   max="100"
                   value="70"
                   data-layer-opacity="mapbasic"
                   aria-label="Độ trong suốt Mapbasic" />
          </div>
        </div>

        <div class="layer-row" data-layer-row="mapbasic3" data-state="idle">
          <div class="layer-main">
            <label class="layer-name">
              <input type="checkbox"
                     data-layer-toggle="mapbasic3" />
              <span>Mapbasic3 · Địa phận tỉnh 2025</span>
            </label>
            <span class="layer-status">Chưa tải</span>
          </div>

          <div class="opacity-row">
            <span>Độ mờ</span>
            <input type="range"
                   min="0"
                   max="100"
                   value="85"
                   data-layer-opacity="mapbasic3"
                   aria-label="Độ trong suốt Mapbasic3 địa phận tỉnh 2025" />
          </div>
        </div>

        <div class="layer-row" data-layer-row="mapbasic4" data-state="idle">
          <div class="layer-main">
            <label class="layer-name">
              <input type="checkbox"
                     data-layer-toggle="mapbasic4" />
              <span>Mapbasic4 · Địa phận xã 2025</span>
            </label>
            <span class="layer-status">Chưa tải</span>
          </div>

          <div class="opacity-row">
            <span>Độ mờ</span>
            <input type="range"
                   min="0"
                   max="100"
                   value="90"
                   data-layer-opacity="mapbasic4"
                   aria-label="Độ trong suốt Mapbasic4 địa phận xã 2025" />
          </div>
        </div>

        <div class="layer-row" data-layer-row="mapbasic5" data-state="idle">
          <div class="layer-main">
            <label class="layer-name">
              <input type="checkbox"
                     data-layer-toggle="mapbasic5"
                     checked />
              <span>Mapbasic5 · Vùng biển</span>
            </label>
            <span class="layer-status">Chưa tải</span>
          </div>

          <div class="opacity-row">
            <span>Độ mờ</span>
            <input type="range"
                   min="0"
                   max="100"
                   value="90"
                   data-layer-opacity="mapbasic5"
                   aria-label="Độ trong suốt Mapbasic5 vùng biển" />
          </div>
        </div>


      </div>
    </section>

    <a class="vietflex-source"
       href="https://github.com/Vietflexmap/VN"
       target="_blank"
       rel="noopener noreferrer"
       title="Mã nguồn Vietflex/VN"
       aria-label="Mã nguồn Vietflex/VN">
      <span class="vietflex-flag" aria-hidden="true">★</span>
      <span class="vietflex-name">Vietflex</span>
    </a>

    <aside id="fatalError" class="fatal-error" hidden role="alert"></aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.js"
          crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"
          crossorigin="anonymous"></script>

  <script src="./config.js?v=11"></script>
  <script src="./app.js?v=9"></script>
</body>
</html>
