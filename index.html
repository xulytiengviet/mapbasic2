<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Vietflex Map — Mapbasic × Mapbasic2</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.css"
        crossorigin="anonymous" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/Vietflexmap/VN@6144d565fcf236727577ab3c4471bbe49f86892f/dist/vietflex.css" />

  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <main id="app" class="compare-layout">

    <section class="map-pane map-pane-left" aria-label="Mapbasic">
      <div id="mapbasic" class="map-canvas"></div>
      <div class="map-label">Mapbasic</div>

      <aside class="pane-error"
             data-error-for="mapbasic"
             hidden
             role="alert">
        <strong class="pane-error-title">Không đọc được Mapbasic</strong>
        <p class="pane-error-message"></p>
      </aside>
    </section>

    <div class="compare-divider" aria-hidden="true"></div>

    <section class="map-pane map-pane-right" aria-label="Mapbasic2">
      <div id="mapbasic2" class="map-canvas"></div>
      <div class="map-label">Mapbasic2</div>

      <aside class="pane-error"
             data-error-for="mapbasic2"
             hidden
             role="alert">
        <strong class="pane-error-title">Không đọc được Mapbasic2</strong>
        <p class="pane-error-message"></p>
      </aside>
    </section>

    <div class="sync-badge" aria-label="Hai bản đồ đồng bộ">
      Đồng bộ vị trí · zoom
    </div>

    <a class="vietflex-source"
       href="https://github.com/Vietflexmap/VN"
       target="_blank"
       rel="noopener noreferrer"
       title="Mã nguồn Vietflex/VN"
       aria-label="Mã nguồn Vietflex/VN">
      <span class="vietflex-flag" aria-hidden="true">★</span>
      <span class="vietflex-name">Vietflex</span>
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.js"
          crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"
          crossorigin="anonymous"></script>

  <script src="./config.js?v=4"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
